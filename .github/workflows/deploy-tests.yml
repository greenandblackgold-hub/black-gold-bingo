name: Deploy package tests
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "client-source/**"
      - ".github/workflows/deploy-tests.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "client-source/**"
      - ".github/workflows/deploy-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --json || true
      - run: npm run typecheck
      - run: npm run build
