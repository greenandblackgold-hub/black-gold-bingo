<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Gold Bingo PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [token, setToken] = React.useState(localStorage.getItem('bingo_token') || '');
            const [user, setUser] = React.useState(JSON.parse(localStorage.getItem('bingo_user') || 'null'));
            const [isLoginView, setIsLoginView] = React.useState(true);
            const [authStep, setAuthStep] = React.useState('phone'); // 'phone' or 'otp'
            
            const [phone, setPhone] = React.useState('');
            const [pin, setPin] = React.useState('');
            const [confirmPin, setConfirmPin] = React.useState('');
            const [name, setName] = React.useState('');
            const [otp, setOtp] = React.useState('');
            const [debugOtpHint, setDebugOtpHint] = React.useState('');

            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState('');
            const [successMsg, setSuccessMsg] = React.useState('');

            // Game & Wallet
            const [balance, setBalance] = React.useState(user?.balance || 0);
            const [depositAmount, setDepositAmount] = React.useState(50);
            const [paymentMethod, setPaymentMethod] = React.useState('telebirr');
            const [txRef, setTxRef] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('game');

            // Admin Deposits state
            const [adminDeposits, setAdminDeposits] = React.useState([]);

            // 1. Send OTP for Registration
            const handleRequestOtp = async (e) => {
                e.preventDefault();
                setError('');
                setSuccessMsg('');
                if (!phone || phone.length < 10) {
                    setError('እባክዎ ትክክለኛ ስልክ ቁጥር ያስገቡ');
                    return;
                }

                setLoading(true);
                try {
                    const res = await fetch('/api/auth/send-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setAuthStep('otp');
                        setDebugOtpHint(data.debugOtp);
                        setSuccessMsg(`${data.message} (OTP: ${data.debugOtp})`);
                    } else {
                        setError(data.message);
                    }
                } catch (err) {
                    setError('ሰርቨር ጋር መገናኘት አልተቻለም');
                } finally {
                    setLoading(false);
                }
            };

            // 2. Register or Login Action
            const handleAuthSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setSuccessMsg('');

                if (!isLoginView && pin !== confirmPin) {
                    setError('ሚስጥራዊ ቁጥሮች (PIN) አይመሳሰሉም');
                    return;
                }

                setLoading(true);
                const endpoint = isLoginView ? '/api/auth/login' : '/api/auth/register';

                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, pin, name, otp })
                    });
                    const data = await res.json();

                    if (data.token) {
                        localStorage.setItem('bingo_token', data.token);
                        localStorage.setItem('bingo_user', JSON.stringify(data.user));
                        setToken(data.token);
                        setUser(data.user);
                        setBalance(data.user.balance || 0);
                    } else {
                        setError(data.message || 'ስህተት ተፈጥሯል');
                    }
                } catch (err) {
                    setError('የሰርቨር ስህተት');
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('bingo_token');
                localStorage.removeItem('bingo_user');
                setToken('');
                setUser(null);
                setAuthStep('phone');
            };

            // 3. Deposit Request Submission
            const handleDepositRequest = async (e) => {
                e.preventDefault();
                if (!txRef) {
                    alert('እባክዎ የትራንዛክሽን ቁጥር (TxID) ያስገቡ');
                    return;
                }
                setLoading(true);
                try {
                    const res = await fetch('/api/payments/deposit-request', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ amount: depositAmount, method: paymentMethod, txRef })
                    });
                    const data = await res.json();
                    alert(data.message);
                    setTxRef('');
                } catch (e) {
                    alert('የክፍያ ጥያቄ መላክ አልተቻለም');
                } finally {
                    setLoading(false);
                }
            };

            // Fetch Admin Pending Deposits
            React.useEffect(() => {
                if (user?.role === 'admin') {
                    fetch('/api/admin/deposits')
                        .then(res => res.json())
                        .then(data => {
                            if (data.success) setAdminDeposits(data.deposits);
                        })
                        .catch(err => console.error(err));
                }
            }, [user]);

            const approveDeposit = async (depositId) => {
                try {
                    const res = await fetch('/api/admin/approve-deposit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ depositId })
                    });
                    const data = await res.json();
                    alert(data.message);
                    setAdminDeposits(prev => prev.filter(d => d._id !== depositId));
                } catch (e) {
                    alert('ማጽደቅ አልተቻለም');
                }
            };

            // 1. AUTH SCREEN
            if (!token) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md shadow-2xl">
                            <h2 className="text-2xl font-bold text-center text-amber-400 mb-2">Black Gold Bingo PRO</h2>
                            <p className="text-center text-slate-400 text-sm mb-6">የኢትዮጵያ አስተማማኝ የቢንጎ መጫወቻ</p>

                            <div className="flex mb-6 bg-slate-800 p-1 rounded-xl">
                                <button onClick={() => { setIsLoginView(true); setAuthStep('phone'); setError(''); }} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition ${isLoginView ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>ግቡ (Sign In)</button>
                                <button onClick={() => { setIsLoginView(false); setAuthStep('phone'); setError(''); }} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition {!isLoginView ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>ይመዝገቡ (Sign Up)</button>
                            </div>

                            {error && <div className="bg-red-500/20 border border-red-500 text-red-300 p-3 rounded-xl mb-4 text-sm text-center">{error}</div>}
                            {successMsg && <div className="bg-emerald-500/20 border border-emerald-500 text-emerald-300 p-3 rounded-xl mb-4 text-sm text-center">{successMsg}</div>}

                            {/* LOGIN FORM */}
                            {isLoginView && (
                                <form onSubmit={handleAuthSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">ስልክ ቁጥር</label>
                                        <input type="text" value={phone} onChange={e => setPhone(e.target.value)} placeholder="09xxxxxxxx" required className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:border-amber-500 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">ሚስጥራዊ ቁጥር (PIN)</label>
                                        <input type="password" value={pin} onChange={e => setPin(e.target.value)} placeholder="******" required className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:border-amber-500 focus:outline-none" />
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full py-3.5 bg-amber-500 text-slate-950 font-bold rounded-xl shadow-lg mt-2">{loading ? 'እየጠበቁ...' : 'ግባ (Sign In)'}</button>
                                </form>
                            )}

                            {/* REGISTER STEP 1: PHONE */}
                            {!isLoginView && authStep === 'phone' && (
                                <form onSubmit={handleRequestOtp} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">ስልክ ቁጥር (OTP ለማግኘት)</label>
                                        <input type="text" value={phone} onChange={e => setPhone(e.target.value)} placeholder="09xxxxxxxx" required className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:border-amber-500 focus:outline-none" />
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full py-3.5 bg-amber-500 text-slate-950 font-bold rounded-xl shadow-lg mt-2">{loading ? 'እየላከ ነው...' : 'የማረጋገጫ ኮድ ላክ (Send OTP)'}</button>
                                </form>
                            )}

                            {/* REGISTER STEP 2: OTP & DETAILS */}
                            {!isLoginView && authStep === 'otp' && (
                                <form onSubmit={handleAuthSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">ወደ ስልክዎ የተላከው 4 አሃዝ OTP</label>
                                        <input type="text" value={otp} onChange={e => setOtp(e.target.value)} placeholder="xxxx" maxLength="4" required className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white text-center text-xl tracking-widest focus:border-amber-500 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">ሙሉ ስም</label>
                                        <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="ስምዎን ያስገቡ" required className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:border-amber-500 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">ሚስጥራዊ ቁጥር (PIN)</label>
                                        <input type="password" value={pin} onChange={e => setPin(e.target.value)} placeholder="******" required className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:border-amber-500 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">ሚስጥራዊ ቁጥር ይድገሙ</label>
                                        <input type="password" value={confirmPin} onChange={e => setConfirmPin(e.target.value)} placeholder="******" required className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:border-amber-500 focus:outline-none" />
                                    </div>
                                    <button type="submit" disabled={loading} className="w-full py-3.5 bg-amber-500 text-slate-950 font-bold rounded-xl shadow-lg mt-2">{loading ? 'እየመዘገበ ነው...' : 'ተመዝገብ (Complete Sign Up)'}</button>
                                    <button type="button" onClick={() => setAuthStep('phone')} className="w-full py-2 text-slate-400 text-sm">ተመለስ</button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            // 2. MAIN APP & BINGO & WALLET & ADMIN PANEL
            return (
                <div className="min-h-screen pb-20 bg-slate-950 text-white">
                    <header className="flex justify-between items-center p-4 bg-slate-900 border-b border-slate-800">
                        <div>
                            <h1 className="font-bold text-amber-400 text-base">Black Gold Bingo PRO</h1>
                            <p className="text-xs text-slate-400">{user?.name} ({user?.phone}) {user?.role === 'admin' && <span className="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded text-[10px] font-bold ml-1">አድሚን</span>}</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="bg-slate-800 px-3 py-1.5 rounded-full text-sm font-bold text-amber-400 border border-slate-700">{balance.toFixed(2)} ብር</span>
                            <button onClick={handleLogout} className="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-bold">ውጣ</button>
                        </div>
                    </header>

                    <main className="p-4 max-w-md mx-auto space-y-4">
                        {activeTab === 'game' && (
                            <div className="space-y-4">
                                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl text-center">
                                    <p className="text-xs text-slate-400 mb-1">ጨዋታው በቅርቡ ይጀምራል</p>
                                    <div className="text-4xl font-extrabold text-amber-400 my-2">--</div>
                                    <p className="text-xs text-slate-500">ዙር 1 · ቀጣዩን ቁጥር በመጠበቅ ላይ</p>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                    <h3 className="font-bold text-sm mb-3">የእርስዎ ቢንጎ ካርድ</h3>
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                                        <p className="text-xs text-amber-400 font-bold mb-2">ካርድ #BG-9021</p>
                                        <div className="grid grid-cols-5 gap-2 text-sm font-mono font-bold">
                                            {['12','28','35','52','67','5','21','40','59','70','15','23','★','55','72','3','31','44','51','68'].map((num, i) => (
                                                <div key={i} className={`p-2 rounded ${num === '★' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-200'}`}>{num}</div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'wallet' && (
                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                                <h3 className="font-bold text-base text-amber-400">ገንዘብ ያስገቡ (Deposit)</h3>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-2">የክፍያ መንገድ ይምረጡ</label>
                                    <div className="grid grid-cols-2 gap-2 mb-3">
                                        <button onClick={() => setPaymentMethod('telebirr')} className={`py-3 rounded-xl font-bold text-sm border ${paymentMethod === 'telebirr' ? 'bg-amber-500 text-slate-950 border-amber-500' : 'bg-slate-950 text-slate-300 border-slate-800'}`}>ቴሌብር (Telebirr)</button>
                                        <button onClick={() => setPaymentMethod('cbe')} className={`py-3 rounded-xl font-bold text-sm border ${paymentMethod === 'cbe' ? 'bg-amber-500 text-slate-950 border-amber-500' : 'bg-slate-950 text-slate-300 border-slate-800'}`}>ንግድ ባንክ (CBE)</button>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded-xl text-xs text-slate-300 mb-3 border border-slate-800">
                                        {paymentMethod === 'telebirr' ? 'የቴሌብር አካውንት: 0978202822' : 'የንግድ ባንክ (CBE): 1000xxxxxxxx'} (ብር ልከው TxID ያስገቡ)
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-2">መጠን (ብር)</label>
                                    <div className="grid grid-cols-4 gap-2 mb-3">
                                        {[50, 100, 200, 500].map(amt => (
                                            <button key={amt} onClick={() => setDepositAmount(amt)} className={`py-2.5 rounded-xl font-bold text-sm border ${depositAmount === amt ? 'bg-amber-500 text-slate-950 border-amber-500' : 'bg-slate-950 text-slate-300 border-slate-800'}`}>{amt}</button>
                                        ))}
                                    </div>
                                    <input type="number" value={depositAmount} onChange={e => setDepositAmount(Number(e.target.value))} className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:border-amber-500 focus:outline-none mb-3" />
                                    
                                    <label className="block text-xs text-slate-400 mb-1">የክፍያ ማረጋገጫ ቁጥር (TxID / Receipt)</label>
                                    <input type="text" value={txRef} onChange={e => setTxRef(e.target.value)} placeholder="ምሳሌ: TXN12345678" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-white focus:border-amber-500 focus:outline-none mb-3" />
                                </div>
                                <button onClick={handleDepositRequest} disabled={loading} className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg">የክፍያ ጥያቄ ላክ</button>
                            </div>
                        )}

                        {/* PRIVATE ADMIN PANEL */}
                        {user?.role === 'admin' && activeTab === 'admin' && (
                            <div className="bg-slate-900 border border-amber-500/50 p-5 rounded-2xl space-y-4">
                                <h3 className="font-bold text-base text-amber-400">የአድሚን መቆጣጠሪያ ፓነል (Admin Panel)</h3>
                                <p className="text-xs text-slate-400">ተጠቃሚዎች የላኳቸው የክፍያ ጥያቄዎች:</p>
                                
                                <div className="space-y-2">
                                    {adminDeposits.length === 0 ? (
                                        <p className="text-xs text-slate-500">ምንም የሚጠበቅ የክፍያ ጥያቄ የለም።</p>
                                    ) : (
                                        adminDeposits.map(dep => (
                                            <div key={dep._id} className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                                                <div>
                                                    <p className="font-bold text-amber-400">{dep.phone} - {dep.amount} ብር</p>
                                                    <p className="text-slate-400">መንገድ: {dep.method} | TxID: {dep.txRef}</p>
                                                </div>
                                                <button onClick={() => approveDeposit(dep._id)} className="bg-emerald-600 px-3 py-1.5 rounded-lg font-bold text-white">አጽድቅ</button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex p-2 max-w-md mx-auto">
                        <button onClick={() => setActiveTab('game')} className={`flex-1 py-3 text-xs font-bold rounded-xl transition ${activeTab === 'game' ? 'text-amber-400 bg-slate-800' : 'text-slate-400'}`}>ጨዋታ</button>
                        <button onClick={() => setActiveTab('wallet')} className={`flex-1 py-3 text-xs font-bold rounded-xl transition ${activeTab === 'wallet' ? 'text-amber-400 bg-slate-800' : 'text-slate-400'}`}>ቦርሳ</button>
                        {user?.role === 'admin' && (
                            <button onClick={() => setActiveTab('admin')} className={`flex-1 py-3 text-xs font-bold rounded-xl transition ${activeTab === 'admin' ? 'text-amber-400 bg-slate-800' : 'text-slate-400'}`}>አድሚን</button>
                        )}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
