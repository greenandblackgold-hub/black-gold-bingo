# Render Blueprint: ONE service serves both the website and the game server.
services:
  - type: web
    name: black-gold-bingo-pro
    rootDir: .
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    numInstances: 1
    buildCommand: npm --prefix deploy install && NODE_ENV=test npm --prefix deploy test && cd client-source && npm install --include=dev --production=false && VITE_SERVER_MODE=true npm run build && cd .. && rm -rf deploy/public && mkdir -p deploy/public && cp -R client-source/dist/. deploy/public/
    startCommand: npm --prefix deploy start
    healthCheckPath: /health
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: JWT_SECRET, generateValue: true }
      - { key: MONGODB_URI, sync: false }
      - { key: ADMIN_PHONE, sync: false }
      - { key: ADMIN_PIN, sync: false }
      - { key: ADMIN_NAME, value: Owner }
      - { key: ROOM_ID, value: BINGO-99 }
      - { key: CARD_PRICE_ETB, value: "10" }
      - { key: PRIZE_PERCENT, value: "80" }
      - { key: AUTO_PAYOUT, value: "false" }
      - { key: REGISTRATION_ENABLED, value: "true" }
      - { key: REAL_MONEY_ENABLED, value: "false" }
      - { key: LOTTERY_LICENSE_APPROVED, value: "false" }
      - { key: CHAPA_MERCHANT_APPROVED, value: "false" }
