<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
<title id="title">Virtual Sports Futuristic 3D Arena</title>
<desc id="desc">Premium futuristic holographic sports arena featuring horse racing, greyhound racing and cricket under electric blue, violet and gold lights.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#08051e"/><stop offset=".48" stop-color="#10104a"/><stop offset="1" stop-color="#07091f"/></linearGradient>
 <radialGradient id="sky"><stop stop-color="#164dba" stop-opacity=".9"/><stop offset=".55" stop-color="#10105c" stop-opacity=".55"/><stop offset="1" stop-color="#09051e" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fffbd0"/><stop offset=".22" stop-color="#ffe477"/><stop offset=".5" stop-color="#f6ad21"/><stop offset=".78" stop-color="#9a4b05"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
 <linearGradient id="cyan" x2="0" y2="1"><stop stop-color="#e6ffff"/><stop offset=".2" stop-color="#50efff"/><stop offset=".55" stop-color="#0878e8"/><stop offset="1" stop-color="#08235e"/></linearGradient>
 <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#f7d7ff"/><stop offset=".35" stop-color="#b64cff"/><stop offset="1" stop-color="#351078"/></linearGradient>
 <linearGradient id="horse" x2=".8" y2="1"><stop stop-color="#ffcf79"/><stop offset=".32" stop-color="#a94a22"/><stop offset=".7" stop-color="#5c1b21"/><stop offset="1" stop-color="#210f29"/></linearGradient>
 <linearGradient id="dog" x2=".8" y2="1"><stop stop-color="#fff1c9"/><stop offset=".45" stop-color="#bd9a79"/><stop offset="1" stop-color="#43314d"/></linearGradient>
 <linearGradient id="white" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#a8c9ff"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
 <clipPath id="clip"><rect x="22" y="22" width="724" height="724" rx="106"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="768" height="768" fill="url(#bg)"/>
 <ellipse cx="390" cy="300" rx="390" ry="300" fill="url(#sky)"/>
 <!-- stadium canopy -->
 <g fill="none" stroke="#21dfff" stroke-linecap="round" filter="url(#glow)">
  <path d="M-50 235Q384 -105 818 235" stroke-width="7" opacity=".65"/>
  <path d="M-20 285Q384 -20 788 285" stroke-width="4" opacity=".55"/>
  <path d="M25 325Q384 70 743 325" stroke-width="3" opacity=".4"/>
 </g>
 <g stroke="#5aeaff" stroke-width="3" fill="none" opacity=".7">
  <path d="M72 190L150 120 228 190M540 190L618 120 696 190"/>
  <path d="M88 205v104m-20-86h40m492-18v104m-20-86h40"/>
  <path d="M160 112l-15-30m25 30 15-30m-10 30 0-40M600 112l-15-30m25 30 15-30m-10 30 0-40"/>
 </g>
 <g fill="#eaffff" filter="url(#glow)">
  <circle cx="150" cy="120" r="7"/><circle cx="618" cy="120" r="7"/><circle cx="384" cy="84" r="6"/>
  <circle cx="80" cy="260" r="5"/><circle cx="688" cy="260" r="5"/>
 </g>
 <!-- holographic scoreboard panels -->
 <g opacity=".8">
  <path d="M70 270l92-48 88 48v75l-88 48-92-48z" fill="#101c62" fill-opacity=".55" stroke="#28dfff" stroke-width="4"/>
  <path d="M518 270l88-48 92 48v75l-92 48-88-48z" fill="#101c62" fill-opacity=".55" stroke="#b74cff" stroke-width="4"/>
  <path d="M90 286h142M538 286h140" stroke="#c9ffff" stroke-width="3" opacity=".5"/>
  <path d="M100 312h85m-85 15h55m398-15h85m-85 15h55" stroke="#42eaff" stroke-width="4" opacity=".7"/>
 </g>
 <!-- stadium floor and racing lanes -->
 <ellipse cx="384" cy="605" rx="345" ry="112" fill="#080b2d" stroke="#1bcfff" stroke-width="8" opacity=".95"/>
 <ellipse cx="384" cy="600" rx="300" ry="82" fill="#11114c" stroke="#7b38e8" stroke-width="8"/>
 <ellipse cx="384" cy="596" rx="250" ry="55" fill="none" stroke="#ffd05a" stroke-width="5" opacity=".85" filter="url(#glow)"/>
 <path d="M65 600Q384 470 703 600M92 635Q384 520 676 635" fill="none" stroke="#35eaff" stroke-width="4" opacity=".7"/>
 <path d="M150 674Q384 590 618 674" fill="none" stroke="#ffcb51" stroke-width="5" opacity=".85"/>
 <!-- horse racer, left -->
 <g transform="translate(100 300)" filter="url(#glow)">
  <!-- tail -->
  <path d="M126 115Q72 78 61 125Q85 147 119 139" fill="none" stroke="#54202a" stroke-width="17" stroke-linecap="round"/>
  <!-- rear legs -->
  <path d="M145 170Q120 220 103 260L75 278Q65 288 83 291L125 281Q154 246 178 207" fill="url(#horse)" stroke="#ffc66b" stroke-width="5"/>
  <path d="M206 173Q220 220 245 250L236 283Q240 297 257 288L276 248Q258 198 252 161" fill="url(#horse)" stroke="#ffc66b" stroke-width="5"/>
  <!-- body -->
  <path d="M93 108Q126 69 205 84Q260 88 279 132Q272 179 224 193Q152 205 108 172Q80 148 93 108Z" fill="url(#horse)" stroke="#ffd17b" stroke-width="7"/>
  <!-- neck/head -->
  <path d="M226 115Q247 71 275 48Q296 34 311 52L303 78Q285 96 292 122L270 151Q242 145 226 115Z" fill="url(#horse)" stroke="#ffd17b" stroke-width="6"/>
  <path d="M279 50Q292 23 315 28L332 48L311 62L293 60" fill="#6d2734" stroke="#ffd17b" stroke-width="5"/>
  <path d="M301 80l28 9-24 8" fill="none" stroke="#1a0d24" stroke-width="7" stroke-linecap="round"/>
  <circle cx="294" cy="63" r="5" fill="#fff"/>
  <!-- front legs in gallop -->
  <path d="M235 166Q278 190 306 216L340 210Q354 215 344 229L302 242Q268 220 215 205" fill="url(#horse)" stroke="#ffd17b" stroke-width="5"/>
  <path d="M194 178Q190 225 165 247L133 252Q119 263 135 271L177 265Q217 232 228 194" fill="url(#horse)" stroke="#ffd17b" stroke-width="5"/>
  <!-- saddle and jockey -->
  <path d="M130 92Q181 70 222 105L205 131Q159 129 126 118Z" fill="#142c89" stroke="#63f5ff" stroke-width="6"/>
  <path d="M148 82Q136 48 159 28L185 33L199 72L220 95L183 106Z" fill="#e51f55" stroke="#ffe3a1" stroke-width="5"/>
  <path d="M150 34Q151 8 180 12Q204 18 198 45L178 58Z" fill="#f4f5ff" stroke="#ffd35e" stroke-width="5"/>
  <path d="M149 27Q176 1 205 26L201 39L151 39Z" fill="#e92545" stroke="#ffe58b" stroke-width="4"/>
  <path d="M180 56L212 91" stroke="#ffd36a" stroke-width="6"/>
 </g>
 <!-- greyhound runner, center -->
 <g transform="translate(355 390)" filter="url(#glow)">
  <path d="M42 87Q82 38 145 48Q195 50 230 78L266 67Q289 62 302 77L276 95Q253 105 226 106Q176 145 105 126L62 145Q38 143 42 126L68 111Z" fill="url(#dog)" stroke="#e8f5ff" stroke-width="6"/>
  <path d="M72 115Q52 154 26 176L7 181Q-4 194 12 199L51 185Q89 148 107 127" fill="url(#dog)" stroke="#d9faff" stroke-width="5"/>
  <path d="M162 119Q183 158 215 174L236 169Q254 176 240 188L207 194Q167 171 135 139" fill="url(#dog)" stroke="#d9faff" stroke-width="5"/>
  <path d="M226 77Q248 35 270 30L291 42L281 68L258 92" fill="url(#dog)" stroke="#f5faff" stroke-width="5"/>
  <path d="M264 35Q272 8 291 16L302 43L283 51Z" fill="#5c4a66" stroke="#f5faff" stroke-width="4"/>
  <path d="M279 62l39 5-23 15-24-4" fill="#d7bda8" stroke="#fff" stroke-width="4"/>
  <circle cx="282" cy="46" r="5" fill="#10112c"/>
  <path d="M112 62Q155 48 190 69L178 112Q139 123 105 98Z" fill="#1766ed" stroke="#8fffff" stroke-width="6"/>
  <path d="M130 70l34 0-8 34-30-4Z" fill="#f5faff" opacity=".8"/>
  <path d="M50 93Q12 71 0 46" fill="none" stroke="#d4b99f" stroke-width="11" stroke-linecap="round"/>
 </g>
 <!-- cricket batter, right -->
 <g transform="translate(570 260)" filter="url(#glow)">
  <!-- legs -->
  <path d="M80 240L61 318L38 350Q36 366 56 361L91 332L119 258" fill="#f1f5ff" stroke="#79eaff" stroke-width="6"/>
  <path d="M135 242L151 316L183 344Q192 359 173 365L132 341L103 265" fill="#e9f1ff" stroke="#79eaff" stroke-width="6"/>
  <!-- torso -->
  <path d="M75 110Q110 86 151 115L166 224Q129 260 76 230L55 148Z" fill="#f1f6ff" stroke="#78eaff" stroke-width="7"/>
  <path d="M80 120L143 125L153 207L88 207Z" fill="#d9e9ff"/>
  <!-- helmet -->
  <circle cx="104" cy="72" r="36" fill="#101c59" stroke="#ffd56d" stroke-width="6"/>
  <path d="M69 73Q70 29 111 30Q146 33 145 76L126 87L77 82Z" fill="#101e6b" stroke="#71f5ff" stroke-width="6"/>
  <path d="M116 77l47 19-39 8" fill="none" stroke="#ffd56d" stroke-width="6"/>
  <!-- arms and bat -->
  <path d="M68 133Q37 106 19 84L-3 67Q-17 62-20 79L11 119Q35 154 76 163" fill="#f1f6ff" stroke="#78eaff" stroke-width="6"/>
  <path d="M148 136Q178 108 194 80L208 57Q220 48 229 62L212 108Q191 152 160 173" fill="#f1f6ff" stroke="#78eaff" stroke-width="6"/>
  <path d="M-8 71L-36 12Q-42-2-29-9L-13-17L25 48Z" fill="#dba66a" stroke="#fff0c2" stroke-width="6"/>
  <path d="M-37 12L-51-7" stroke="#fff1c8" stroke-width="9"/>
  <path d="M193 79L246-15Q252-28 267-20L281-12L221 97Z" fill="#dba66a" stroke="#fff0c2" stroke-width="6"/>
 </g>
 <!-- holographic streaks and stars -->
 <g fill="none" stroke-linecap="round" filter="url(#glow)">
  <path d="M58 470Q230 405 360 465" stroke="#20e9ff" stroke-width="7"/>
  <path d="M390 535Q535 445 710 475" stroke="#b64cff" stroke-width="8"/>
  <path d="M72 520Q280 570 440 530" stroke="#ffd05a" stroke-width="5"/>
 </g>
 <g fill="#fff" filter="url(#glow)">
  <path d="M384 170l9 24 24 9-24 9-9 24-9-24-24-9 24-9z"/>
  <path d="M690 390l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#54f5ff"/>
  <path d="M80 400l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#ffd76c"/>
 </g>
 <!-- gold and neon border -->
 <rect x="22" y="22" width="724" height="724" rx="106" fill="none" stroke="url(#gold)" stroke-width="20" filter="url(#glow)"/>
 <rect x="43" y="43" width="682" height="682" rx="88" fill="none" stroke="#bafaff" stroke-opacity=".65" stroke-width="4"/>
 <path d="M115 43h538M115 725h538" stroke="#fff2b0" stroke-width="3" opacity=".65"/>
</g></svg>